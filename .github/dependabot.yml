version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine minor/patch bumps; majors arrive individually.
      minor-and-patch:
        update-types: [minor, patch]
      playwright:
        patterns: ['playwright', '@playwright/*']
    ignore:
      # The e2e job's container image is pinned to the Playwright version —
      # bump both together by hand.
      - dependency-name: '@playwright/test'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: playwright
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
